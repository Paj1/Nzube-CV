<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ifeanyi Nzube Precious | Customer Support Specialist & Virtual Assistant</title>
<meta name="description" content="Customer Support Specialist and Virtual Assistant with 5+ years of client-facing experience. CRM, client follow-up, remote support.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b08;--card:#18140e;--line:#33291a;--ink:#ece6da;--mute:#a89f8d;--gold:#d4af37;--gold2:#f3e5ab}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Plus Jakarta Sans",system-ui,sans-serif}
.serif{font-family:"Playfair Display",Georgia,serif}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
a{color:var(--gold)}
.hero{padding:72px 0 56px;border-bottom:1px solid var(--line)}
.badge{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:4px 14px;font-size:13px;margin-bottom:22px}
h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.1;margin:0 0 10px;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#aa8c2c);-webkit-background-clip:text;background-clip:text;color:transparent}
.role{font-size:1.1rem;margin:0 0 6px}
.loc{color:var(--mute);margin:0 0 26px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:600;border:1px solid var(--gold)}
.btn.main{background:var(--gold);color:#16120a}
.btn.alt{color:var(--gold)}
.btn:focus-visible,a:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
section{padding:48px 0 8px}
h2{font-family:"Playfair Display",Georgia,serif;font-size:1.7rem;margin:0 0 20px;color:var(--gold2)}
h2::after{content:"";display:block;width:48px;height:2px;background:var(--gold);margin-top:8px}
.job{position:relative;margin:0 0 26px;padding:0 0 0 22px;border-left:2px solid var(--line)}
.job::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--gold)}
.job h3{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:1.15rem}
.job .org{color:var(--mute);font-size:.95rem;margin:2px 0}
.job .date{color:var(--gold);font-size:.85rem;font-weight:600;margin:0 0 8px}
ul{margin:0;padding-left:20px}
li{margin:5px 0;color:#d6cfc0}
