<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ifeanyi Nzube Precious | Customer Support Specialist & Virtual Assistant</title>
<meta name="description" content="Customer Support Specialist and Virtual Assistant with 5+ years of client-facing experience. CRM, client follow-up, remote support.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090a;--card:rgba(22,20,16,.72);--line:rgba(212,175,55,.2);--ink:#ebe6da;--mute:#9d968a;--gold:#d4af37;--gold2:#f3e5ab;--gold3:#aa8c2c}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:-1}
body::before{top:-120px;left:10%;background:rgba(212,175,55,.09)}
body::after{bottom:-120px;right:5%;background:rgba(180,110,30,.07)}
a{color:inherit;text-decoration:none}
.serif,h1,h2,h3{font-family:"Playfair Display",Georgia,serif}
.gold{background:linear-gradient(135deg,var(--gold2),var(--gold) 50%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:1000px;margin:0 auto;padding:0 22px}
nav{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(9,9,10,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font:700 1.05rem "Playfair Display",Georgia,serif;letter-spacing:3px}
.links{display:flex;align-items:center;gap:28px;font-size:14px;color:#c9c3b6}
.links a:hover{color:var(--gold)}
.pill{padding:9px 20px;border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold3));color:#14110a!important;font-weight:600}
@media(max-width:700px){.links a:not(.pill){display:none}}
.hero{min-height:100svh;display:flex;align-items:center;text-align:center;padding:110px 0 70px}
.badge{display:inline-flex;align-items:center;gap:9px;padding:7px 18px;border:1px solid rgba(212,175,55,.4);border-radius:999px;font-size:11.5px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);background:var(--card)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
h1{font-size:clamp(2.5rem,8.5vw,4.9rem);line-height:1.08;font-weight:700;margin:28px 0 22px;letter-spacing:-.5px}
.sub{max-width:620px;margin:0 auto;color:#aaa396;font-size:1.1rem;font-weight:300}
.btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:34px}
.btn{padding:15px 32px;border-radius:999px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--card);transition:.3s}
.btn.main{background:linear-gradient(135deg,var(--gold),var(--gold3));color:#14110a;border:0;box-shadow:0 12px 34px -10px rgba(212,175,55,.5)}
.btn:hover{transform:translateY(-2px);border-color:var(--gold)}
